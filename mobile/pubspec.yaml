name: dijital_lastik_servisi
description: Dijital Lastik Servisi Mobil Uygulaması
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # HTTP
  dio: ^5.4.0

  # Güvenli token saklama (Android Keystore / iOS Keychain)
  flutter_secure_storage: ^9.0.0

  # Barkod / QR kamera okuma
  mobile_scanner: ^7.0.0

  # State management
  flutter_riverpod: ^2.5.0

  # Route
  go_router: ^13.2.0

  # UI
  cupertino_icons: ^1.0.6

  # Tarih / para biçimi (Türkçe)
  intl: any

  # Rapor PDF çıktısı ve yazdırma
  pdf: ^3.12.0
  printing: ^5.14.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true
  assets:
    - assets/icon/
    - assets/fonts/

  # Inter (SIL Open Font License — assets/fonts/OFL.txt). Arayüz ve PDF'te
  # Türkçe karakterler için.
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700

flutter_launcher_icons:
  android: "ic_launcher"
  ios: true
  image_path: "assets/icon/icon.png"
  remove_alpha_ios: true
  background_color_ios: "#1A2D52"
  adaptive_icon_background: "#1A2D52"
  adaptive_icon_foreground: "assets/icon/icon.png"
