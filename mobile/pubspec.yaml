name: dijital_lastik_servisi
description: Dijital Lastik Servisi Mobil Uygulaması
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # HTTP
  dio: ^5.4.0

  # Güvenli token saklama (Android Keystore / iOS Keychain)
  flutter_secure_storage: ^9.0.0

  # Barkod / QR kamera okuma
  mobile_scanner: ^5.1.0

  # State management
  flutter_riverpod: ^2.5.0

  # Route
  go_router: ^13.2.0

  # UI
  cupertino_icons: ^1.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
